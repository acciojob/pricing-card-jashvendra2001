
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
    }

    .card {
      width: 440px;
      max-width: 90%;
      padding: 60px;
      background-color: #f2f2f2;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card h1 {
      font-size: 54px;
      margin: 8px 0 4px;
      white-space: nowrap;
    }

    .card p {
      font-size: 30px;
      margin: 0;
      line-height: 1.2;
    }

    .card button {
      padding: 18px 20px;
      margin-top: 22px;
      background-color: #ff625c;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 30px;
      cursor: pointer;
    }

    .card button:hover {
      background-color: #e94d48;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }

      .card h1 {
        font-size: 38px;
      }

      .card p {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <img
      src="https://images.unsplash.com/photo-1490750967868-88aa4486c946"
      alt="Beautiful flowers"
    >

    <h1>Pricing Card</h1>

    <p>Price: Rs.200</p>

    <p>
      Description: Lorem ipsum dolor sit amet,
      consectetur adipisicing elit.
    </p>

    <button type="button">Buy Now</button>
  </div>

</body>
</html>
